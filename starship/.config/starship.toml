"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_green)\
$os\
$username\
[](fg:color_green bg:color_bg1)\
$directory\
[](fg:color_bg1 bg:color_bg3)\
$git_branch\
$git_status\
[](fg:color_bg3 bg:color_bg1)\
$docker_context\
$conda\
$pixi\
[](fg:color_bg1 bg:color_bg0)\
$time\
[ ](fg:color_bg0)\
$line_break$character"""

palette = 'kanagawa_dragon'

[palettes.kanagawa_dragon]
color_bg0 = '#181616'     # dragonBlack3
color_bg1 = '#282727'     # dragonBlack4
color_bg3 = '#393836'     # dragonBlack5
color_fg0 = '#c5c9c5'     # dragonWhite
color_muted = '#737c73'   # dragonAsh
color_green = '#87a987'   # dragonGreen (Accent Primary)
color_moss = '#8a9a7b'    # dragonGreen2 (Accent Secondary)
color_purple = '#87a987'  # Primary Accent Alias (dragonGreen)
color_aqua = '#8ea4a2'    # dragonAqua
color_blue = '#8ba4b0'    # dragonBlue
color_orange = '#b6927b'  # dragonOrange
color_red = '#c4746e'     # dragonRed
color_yellow = '#c4b28a'  # dragonYellow

[os]
disabled = false
style = "bg:color_green fg:color_bg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_purple fg:color_bg0 bold"
style_root = "bg:color_purple fg:color_bg0 bold"
format = '[ $user ]($style)'

[directory]
style = "fg:color_blue bg:color_bg1 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol $branch ](fg:color_aqua bg:color_bg3 bold)]($style)'

[git_status]
style = "bg:color_bg3"
format = '[[($all_status$ahead_behind )](fg:color_green bg:color_bg3)]($style)'

[nodejs]
disabled = true

[c]
disabled = true

[cpp]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[php]
disabled = true

[java]
disabled = true

[kotlin]
disabled = true

[haskell]
disabled = true

[python]
disabled = true

[docker_context]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $context) ](fg:color_blue bg:color_bg1)]($style)'

[conda]
style = "bg:color_bg1"
format = '[[ $symbol( $environment) ](fg:color_blue bg:color_bg1)]($style)'

[pixi]
style = "bg:color_bg1"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg0"
format = '[[  $time ](fg:color_muted bg:color_bg0)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_purple)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
