[manager]
# Layout: Parent, Current, Preview
ratio = [ 1, 4, 3 ]
sort_by = "natural"
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "lanczos3" # Bessere Bildqualität
image_quality = 90
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

# Prüfe, ob du Plugins für spezielle Formate brauchst. 
# Standardmäßig sollte Yazi jetzt alles erkennen.
