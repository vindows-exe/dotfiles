# ==========================================
# Modern Minimal Tmux Configuration
# ==========================================

# 1. Prefix: Strg + a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 2. 24-Bit Farben (TrueColor) & Terminal-Support für Neovim
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

# 3. Ergonomie & Performance
set -s escape-time 0             # Keine Verzögerung bei Esc in Neovim
set -g mouse on                  # Mausunterstützung (Scrollen, Resize)
set -g base-index 1              # Fenster ab 1 nummerieren
set -g pane-base-index 1         # Panes ab 1 nummerieren
set-window-option -g pane-base-index 1
set-option -g renumber-windows on # Fenster automatisch nachrücken
set-option -g focus-events on    # Wichtig für Neovim FocusGained/FocusLost
set -g history-limit 50000       # Großer Scrollback-Puffer

# 4. Intuitive Splits im aktuellen Verzeichnis (Vim-Style: v für vertikal, s für horizontal)
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 5. Konfiguration schnell neu laden mit Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux-Konfiguration neu geladen!"

# 6. Vim-Tmux-Navigator (Nahtlose Navigation mit Neovim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# 7. Vi-Mode für Copy/Paste (Prefix + [)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# 8. Tmux-Sessionizer Shortcut (Prefix + f)
bind-key -r f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer"

# 9. Minimalistische Kanagawa Dragon-Statusleiste
set -g status-position bottom
set -g status-style "bg=#282727,fg=#c5c9c5"
setw -g window-status-current-style "bg=#87a987,fg=#181616,bold"
setw -g window-status-style "bg=#282727,fg=#737c73"
set -g pane-border-style "fg=#625e5a"
set -g pane-active-border-style "fg=#87a987"
set -g message-style "bg=#c4b28a,fg=#181616"
set -g mode-style "bg=#393836,fg=#c5c9c5"
set -g status-left-length 40
set -g status-left "#[fg=#181616,bg=#87a987,bold] #S #[fg=#87a987,bg=#282727,nobold] "
set -g status-right "#[fg=#8ba4b0,bg=#282727] %H:%M #[fg=#393836,bg=#282727]#[fg=#c5c9c5,bg=#393836] %d-%b-%y "
set -g window-status-current-format "#[fg=#181616,bg=#87a987,bold] #I:#W #[fg=#87a987,bg=#282727,nobold]"
set -g window-status-format "#[fg=#737c73,bg=#282727] #I:#W "
